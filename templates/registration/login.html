{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Sign In - Setlore</title>

  <!-- PWA & Apple iOS Configuration -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Setlore">
  <meta name="application-name" content="Setlore">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="icon" type="image/png" href="{% static 'img/setlore_icon.png' %}">
  <link rel="apple-touch-icon" href="{% static 'img/setlore_icon.png' %}">
  <link rel="apple-touch-icon" sizes="152x152" href="{% static 'img/setlore_icon.png' %}">
  <link rel="apple-touch-icon" sizes="167x167" href="{% static 'img/setlore_icon.png' %}">
  <link rel="apple-touch-icon" sizes="180x180" href="{% static 'img/setlore_icon.png' %}">
  <link rel="manifest" href="{% static 'manifest.json' %}">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      touch-action: manipulation;
      -webkit-touch-callout: none;
      -webkit-text-size-adjust: 100%;
    }
    button, a, input, select, textarea {
      touch-action: manipulation;
    }
    .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 1rem; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
  <div class="max-w-md w-full glass-card p-8 shadow-2xl space-y-6">
    <div class="text-center space-y-2">
      <img src="{% static 'img/setlore_banner.png' %}" alt="Setlore" class="h-14 mx-auto w-auto object-contain mb-1">
      <p class="text-xs text-slate-400">Sign in to access your concert history and setlists</p>
    </div>

    {% if form.errors %}
      <div class="p-3 rounded-lg bg-rose-500/20 border border-rose-500/30 text-rose-300 text-xs">
        <i class="fa-solid fa-triangle-exclamation mr-1"></i> Invalid username or password.
      </div>
    {% endif %}

    <form method="post" action="{% url 'login' %}" class="space-y-4">
      {% csrf_token %}
      <div>
        <label for="id_username" class="block text-xs font-semibold text-slate-300 mb-1">Username</label>
        <input type="text" name="username" id="id_username" required autofocus class="w-full px-3.5 py-2.5 rounded-lg bg-slate-900/80 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition text-sm">
      </div>

      <div>
        <label for="id_password" class="block text-xs font-semibold text-slate-300 mb-1">Password</label>
        <input type="password" name="password" id="id_password" required class="w-full px-3.5 py-2.5 rounded-lg bg-slate-900/80 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition text-sm">
      </div>

      <button type="submit" class="w-full py-2.5 px-4 rounded-lg bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-bold text-sm shadow-lg shadow-indigo-500/30 transition transform hover:-translate-y-0.5">
        Sign In
      </button>
    </form>

    <div class="text-center pt-2 border-t border-slate-800 text-xs text-slate-400">
      Don't have an account? 
      <a href="{% url 'register' %}" class="text-indigo-400 hover:text-indigo-300 font-semibold underline">Register here</a>
    </div>
  </div>
</body>
</html>
