{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Password Changed - Setlore</title>

  <!-- PWA & Apple iOS Configuration -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Setlore">
  <meta name="application-name" content="Setlore">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="icon" type="image/png" href="{% static 'img/setlore_icon.png' %}">
  <link rel="apple-touch-icon" href="{% static 'img/setlore_icon.png' %}">
  <link rel="apple-touch-icon" sizes="152x152" href="{% static 'img/setlore_icon.png' %}">
  <link rel="apple-touch-icon" sizes="167x167" href="{% static 'img/setlore_icon.png' %}">
  <link rel="apple-touch-icon" sizes="180x180" href="{% static 'img/setlore_icon.png' %}">
  <link rel="manifest" href="{% static 'manifest.json' %}">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      touch-action: manipulation;
      -webkit-touch-callout: none;
      -webkit-text-size-adjust: 100%;
    }
    button, a, input, select, textarea {
      touch-action: manipulation;
    }
    .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 1rem; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
  <div class="max-w-md w-full glass-card p-8 shadow-2xl space-y-6 text-center">
    <img src="{% static 'img/setlore_banner.png' %}" alt="Setlore" class="h-12 mx-auto w-auto object-contain">
    <div class="w-14 h-14 mx-auto rounded-2xl bg-gradient-to-tr from-emerald-500 to-teal-500 flex items-center justify-center text-white shadow-lg shadow-emerald-500/30">
      <i class="fa-solid fa-check text-2xl"></i>
    </div>
    <div>
      <h1 class="text-xl font-bold text-white tracking-tight">Password Changed!</h1>
      <p class="text-xs text-slate-300 mt-2">Your password has been successfully updated.</p>
    </div>

    <div class="pt-4">
      <a href="{% url 'dashboard' %}" class="inline-flex items-center justify-center gap-2 w-full py-2.5 px-4 rounded-lg bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-bold text-sm shadow-lg shadow-indigo-500/30 transition transform hover:-translate-y-0.5">
        <i class="fa-solid fa-house text-xs"></i>
        <span>Return to Overview</span>
      </a>
    </div>
  </div>
</body>
</html>
